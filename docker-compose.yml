services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rf_nids
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rf_nids_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rf_nids"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rf_nids_postgres:
